<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin — Financials | ServiceConnect Nigeria</title>
  <link rel="stylesheet" href="../../css/main.css" />
  <link rel="stylesheet" href="../../css/components.css" />
  <link rel="stylesheet" href="../../css/admin.css" />
  <link rel="stylesheet" href="../../css/navbar.css" />
  <link rel="stylesheet" href="../../css/sidebar.css" />
</head>
<body>

<div class="sc-layout">
<div id="sidebar-container"></div>

  <div class="sc-main">
    <div id="navbar-container"></div>

    <main class="sc-page-content">
      <div class="admin-page-header">
        <div>
          <p class="admin-page-sub">Financial Overview</p>
          <p class="admin-page-sub">Real-time revenue monitoring and payout management for ServiceConnect Nigeria.</p>
        </div>
        <div class="admin-page-actions">
          <button class="sc-btn sc-btn--outline">⬇ Export Report</button>
          <button class="sc-btn sc-btn--primary" id="processPayoutsBtn">Process All Payouts</button>
        </div>
      </div>

      <!-- Stat Cards -->
      <div class="admin-stats-grid" id="financialStats"></div>

      <!-- Charts Row -->
      <div class="admin-charts-row">
        <div class="admin-chart-card admin-chart-card--wide">
          <div class="admin-chart-card__header">
            <h2 class="admin-chart-card__title">Monthly Revenue Trend</h2>
            <select class="admin-period-select" style="font-size:var(--font-xs);">
              <option>Last 6 Months</option>
            </select>
          </div>
          <div class="admin-chart-area">
            <canvas id="revenueChart" height="220"></canvas>
          </div>
        </div>

        <div class="admin-chart-card">
          <div class="admin-chart-card__header">
            <h2 class="admin-chart-card__title">Revenue by Category</h2>
          </div>
          <div class="admin-donut-wrap">
            <canvas id="categoryDonut" width="180" height="180"></canvas>
          </div>
          <ul class="admin-donut-legend" id="categoryLegend"></ul>
        </div>
      </div>

      <!-- Transaction Log -->
      <div class="admin-table-card">
        <div class="admin-activity-card__header" style="padding: var(--space-5) var(--space-6) 0;">
          <h2 class="admin-chart-card__title">Transaction Log</h2>
          <div class="admin-table-actions">
            <button class="admin-table-action" aria-label="Filter">⚙</button>
            <button class="admin-table-action" aria-label="More">⋮</button>
          </div>
        </div>
        <table class="admin-table">
          <thead>
            <tr>
              <th>TRANSACTION ID</th>
              <th>DATE</th>
              <th>SERVICE TYPE</th>
              <th>ARTISAN</th>
              <th>CUSTOMER</th>
              <th>AMOUNT</th>
              <th>COMMISSION</th>
            </tr>
          </thead>
          <tbody id="txnTableBody"></tbody>
        </table>
        <div class="admin-table-footer">
          <p class="admin-table-count" id="txnCount"></p>
          <div class="admin-pagination">
            <button class="admin-pagination__btn">‹</button>
            <button class="admin-pagination__btn admin-pagination__btn--active">1</button>
            <button class="admin-pagination__btn">2</button>
            <button class="admin-pagination__btn">3</button>
            <button class="admin-pagination__btn">›</button>
          </div>
        </div>
      </div>

    </main>
  </div>
</div>
    <script type="module" src="../../js/admin/financials.js"></script>
</body>
</html>
