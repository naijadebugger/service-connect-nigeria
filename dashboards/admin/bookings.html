<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin — Booking Management | ServiceConnect Nigeria</title>
    <link rel="stylesheet" href="../../css/main.css" />
    <link rel="stylesheet" href="../../css/components.css" />
    <link rel="stylesheet" href="../../css/admin.css" />
    <link rel="stylesheet" href="../../css/navbar.css" />
    <link rel="stylesheet" href="../../css/sidebar.css" />
  </head>
  <body>
    <div class="sc-layout">
      <div id="sidebar-container"></div>

      <div class="sc-main">
      <div id="navbar-container"></div>

      <main class="sc-page-content">
        <div class="admin-page-header">
          <div>
            <h1 class="admin-page-title">Booking Management</h1>
            <p class="admin-page-sub">Monitor and manage all service requests across the platform.</p>
          </div>
          <button class="sc-btn sc-btn--outline" id="exportBtn">⬇ Export Report</button>
        </div>

      <!-- Stat Cards -->
      <div class="admin-stats-grid" id="bookingStats"></div>

      <!-- Filter Bar -->
      <div class="admin-filter-bar">
        <div class="sc-field__wrapper admin-filter-search">
          <span class="sc-field__icon sc-field__icon--left">🔍</span>
          <input id="bookingSearch" class="sc-input sc-input--icon-left"
            type="search" placeholder="Search by ID, Name, Artisan..." />
        </div>
        <select class="admin-filter-select" id="statusFilter">
          <option value="">All Statuses</option>
          <option value="Pending">Pending</option>
          <option value="In Progress">In Progress</option>
          <option value="Completed">Completed</option>
          <option value="Confirmed">Confirmed</option>
          <option value="Cancelled">Cancelled</option>
        </select>
        <select class="admin-filter-select" id="categoryFilter">
          <option value="">All Categories</option>
          <option value="Plumbing">Plumbing</option>
          <option value="Electrical">Electrical</option>
          <option value="Cleaning">Cleaning</option>
          <option value="Carpentry">Carpentry</option>
        </select>
        <button class="sc-btn sc-btn--outline sc-btn--icon" aria-label="Date range">📅</button>
      </div>

      <!-- Table -->
      <div class="admin-table-card">
        <table class="admin-table">
          <thead>
            <tr>
              <th>BOOKING ID</th>
              <th>SERVICE / CATEGORY</th>
              <th>CUSTOMER</th>
              <th>ARTISAN</th>
              <th>DATE & TIME</th>
              <th>AMOUNT</th>
              <th>STATUS</th>
              <th>ACTION</th>
            </tr>
          </thead>
          <tbody id="bookingsTableBody"></tbody>
        </table>
        <div class="admin-table-footer">
          <p class="admin-table-count" id="bookingCount"></p>
          <div class="admin-pagination">
            <button class="admin-pagination__btn">‹</button>
            <button class="admin-pagination__btn admin-pagination__btn--active">1</button>
            <button class="admin-pagination__btn">2</button>
            <button class="admin-pagination__btn">3</button>
            <span class="admin-pagination__ellipsis">...</span>
            <button class="admin-pagination__btn">10</button>
            <button class="admin-pagination__btn">›</button>
          </div>
        </div>
      </div>
      </main>
      </div>
  </div>

      <script type="module" src="../../js/admin/bookings.js"></script>
  </body>
</html>
