<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin — Platform Overview | ServiceConnect Nigeria</title>
  <link rel="stylesheet" href="../../css/main.css" />
  <link rel="stylesheet" href="../../css/components.css" />
  <link rel="stylesheet" href="../../css/admin.css" />
  <link rel="stylesheet" href="../../css/navbar.css" />
  <link rel="stylesheet" href="../../css/sidebar.css" />
</head>
<body>

<div class="sc-layout">

  <!-- SIDEBAR -->
  <div id="sidebar-container"></div>
  <!-- MAIN CONTENT -->
  <div class="sc-main">

    <!-- TOP NAVBAR -->
    <div id="navbar-container"></div>
    
    <!-- PAGE CONTENT -->
    <main class="sc-page-content">
      <div class="admin-page-header">
        <div>
          <h1 class="admin-page-title">Platform Overview</h1>
          <p class="admin-page-sub">Monitor key metrics and recent activity across ServiceConnect.</p>
        </div>
        <div class="admin-page-actions">
          <select class="admin-period-select" id="periodSelect" aria-label="Select time period">
            <option value="30">Last 30 Days</option>
            <option value="7">Last 7 Days</option>
            <option value="90">Last 90 Days</option>
          </select>
        </div>
      </div>

      <!-- STAT CARDS -->
      <div class="admin-stats-grid" id="statsGrid"></div>

      <!-- CHARTS ROW -->
      <div class="admin-charts-row">
        <!-- Platform Growth Chart -->
        <div class="admin-chart-card admin-chart-card--wide">
          <div class="admin-chart-card__header">
            <h2 class="admin-chart-card__title">Platform Growth</h2>
            <button class="admin-chart-card__menu" aria-label="Chart options">⋮</button>
          </div>
          <div class="admin-chart-legend">
            <span class="admin-legend-item admin-legend-item--navy">Users</span>
            <span class="admin-legend-item admin-legend-item--orange">Artisans</span>
          </div>
          <div class="admin-chart-area">
            <canvas id="growthChart" height="220" aria-label="Platform growth line chart"></canvas>
          </div>
        </div>

        <!-- Booking Status Donut -->
        <div class="admin-chart-card">
          <div class="admin-chart-card__header">
            <h2 class="admin-chart-card__title">Booking Status</h2>
            <button class="admin-chart-card__menu" aria-label="Chart options">⋮</button>
          </div>
          <div class="admin-donut-wrap">
            <canvas id="bookingDonut" width="180" height="180" aria-label="Booking status donut chart"></canvas>
          </div>
          <ul class="admin-donut-legend" id="donutLegend"></ul>
        </div>
      </div>

      <!-- RECENT ACTIVITY -->
      <div class="admin-activity-card">
        <div class="admin-activity-card__header">
          <h2 class="admin-chart-card__title">Recent Activity</h2>
          <a href="#" class="admin-view-all">View All</a>
        </div>
        <ul class="admin-activity-list" id="activityList"></ul>
      </div>
    </main>
  </div>
</div>

  <!-- MODULE LIFE-CYCLE LINK -->
  <script type="module" src="../../js/admin/admin-overview.js"></script>
</body>
</html>
